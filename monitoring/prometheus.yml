global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'simples-backend'
    static_configs:
      - targets: ['backend:5000']
    metrics_path: /metrics

  - job_name: 'simples-host'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

rule_files:
  - alerts.yml
