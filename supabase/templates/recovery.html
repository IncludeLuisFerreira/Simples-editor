<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha — Simples Editor</title>
</head>
<body style="margin:0;padding:0;background:#1a1b26;font-family:sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#1a1b26;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background:#24283b;border:1px solid #292e42;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="height:3px;background:linear-gradient(90deg,transparent,#bb9af7,transparent);"></td>
          </tr>
          <tr>
            <td align="center" style="padding:32px 40px 8px;">
              <span style="font-family:monospace;font-size:40px;font-weight:700;color:#bb9af7;">&lt;/&gt;</span>
              <h1 style="margin:12px 0 4px;font-size:22px;font-weight:700;color:#c0caf5;">
                <span style="color:#7aa2f7;">S</span>imples Editor
              </h1>
              <p style="margin:0;font-size:13px;color:#a9b1d6;">Redefinição de senha</p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px 8px;">
              <hr style="border:none;border-top:1px solid #292e42;margin:0 0 24px;" />
              <p style="margin:0 0 8px;font-size:14px;color:#a9b1d6;">Seu código de recuperação é:</p>
              <div style="background:#1a1b26;border:1px solid #3b4261;border-radius:8px;padding:20px;text-align:center;margin:0 0 20px;">
                <span style="font-family:monospace;font-size:32px;font-weight:700;letter-spacing:0.5em;color:#bb9af7;">{{ .Token }}</span>
              </div>
              <p style="margin:0 0 8px;font-size:13px;color:#565f89;">
                Digite este código na tela de recuperação de senha. Ele expira em <strong style="color:#a9b1d6;">1 hora</strong>.
              </p>
              <p style="margin:0;font-size:13px;color:#565f89;">
                Se você não solicitou a redefinição de senha, ignore este email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px 32px;">
              <hr style="border:none;border-top:1px solid #292e42;margin:0 0 16px;" />
              <p style="margin:0;font-size:11px;color:#3b4261;text-align:center;">
                Simples Editor &mdash; Compilador didático da linguagem Simples
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
