version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    env_file:
      - .env
    expose:
      - "80"
    networks:
      - app_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - RUNNER_IMAGE=simples-runner:latest
      - LOG_LEVEL=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - simples_tmp:/tmp/simples
    depends_on:
      - runner_image_build
    networks:
      - app_network
    restart: unless-stopped

  nginx_app:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_network
    restart: unless-stopped

  runner_image_build:
    build:
      context: ./runner
      dockerfile: Dockerfile
    image: simples-runner:latest
    command: ["true"]
    restart: "no"

volumes:
  simples_tmp:

networks:
  app_network:
    driver: bridge
